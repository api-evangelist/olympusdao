apis:
- name: Olympus OHM Circulating Supply API
  description: >-
    Serverless GCP Cloud Function that returns the current OHM circulating supply as a plain-text numeric
    string. Reads from a one-hour Firestore cache backed by the Olympus Protocol Metrics API. Used by
    CoinGecko to display accurate circulating supply on the OHM token page. Cache can be bypassed with
    ?cache=false.
  image: https://www.olympusdao.finance/images/og-image.png
  humanURL: https://github.com/OlympusDAO/coingecko-api
  baseURL: https://circulating-supply.api.olympusdao.finance
  tags:
  - OHM Supply
  - CoinGecko
  - Circulating Supply
  properties:
  - type: GitHubRepository
    url: https://github.com/OlympusDAO/coingecko-api
  contact:
  - FN: OlympusDAO
    url: https://www.olympusdao.finance/
  endpoints:
  - name: OHM Circulating Supply
    description: >-
      Returns the current OHM circulating supply as a plain-text numeric string. Cached in Firestore for
      one hour; append ?cache=false to force a live fetch from the treasury subgraph API.
    method: GET
    path: /
    parameters:
    - name: cache
      in: query
      required: false
      description: Set to "false" to bypass the one-hour Firestore cache.
      schema:
        type: string
        enum:
        - 'false'
    tags:
    - OHM Supply
    - Circulating Supply
