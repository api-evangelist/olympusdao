  contact:
  - FN: OlympusDAO
    url: https://www.olympusdao.finance/
  endpoints:
  - name: OHM Total Supply
    description: >-
      Returns the current OHM total supply as a plain-text numeric string. Cached in Firestore for one
      hour; append ?cache=false to force a live fetch from the treasury subgraph API.
    method: GET
    path: /
    parameters:
    - name: cache
      in: query
      required: false
      description: Set to "false" to bypass the one-hour Firestore cache.
      schema:
        type: string
        enum:
